<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Onboarding — Lost Pines Creative</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="onboarding.css">
  <script src="/analytics.js"></script>
</head>
<body>
  <header class="p-top">
    <a class="p-brand" href="/" id="brand-link">
      <img src="" alt="" id="brand-logo">
      <span id="brand-name">Onboarding</span> <small>Onboarding</small>
    </a>
    <div class="spacer"></div>
    <span class="who" id="who"></span>
    <span class="save-flag" id="save-flag" style="margin-left:14px"></span>
    <button class="btn btn-ghost btn-sm" id="signout" style="margin-left:10px">Sign out</button>
  </header>

  <!-- loading -->
  <div class="wrap view active" id="view-loading"><div class="spinner"></div></div>

  <!-- needs sign-in -->
  <div class="wrap view" id="view-auth">
    <div class="card" style="text-align:center;max-width:460px;margin:40px auto">
      <h2 style="font-size:1.5rem;margin-bottom:8px">Sign in to start your brief</h2>
      <p class="muted" id="auth-hint">Your onboarding lives in your client portal. Sign in there, then come back to this page.</p>
      <p style="margin-top:18px"><a class="btn btn-primary" id="auth-portal" href="#">Go to the portal →</a></p>
    </div>
  </div>

  <!-- wizard -->
  <div class="wrap view" id="view-wizard">
    <div class="stepper" id="stepper"></div>
    <h2 class="step-title" id="step-title"></h2>
    <p class="step-sub" id="step-sub"></p>
    <div id="step-body"></div>
    <div class="nav-row" id="nav"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
