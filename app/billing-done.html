<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billing updated — Lost Pines Creative</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b1210">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <style>
    :root { --bg:#0b1210; --surface:#111f1b; --border:#1a2f28; --text:#e2e8e6; --text-muted:#94a3a0; --accent-light:#5fb896; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text);
      line-height:1.6; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
    main { width:100%; max-width:480px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:24px 20px; text-align:center; }
    h1 { font-size:1.3rem; margin:12px 0 6px; }
    p { color:var(--text-muted); }
    a { color:var(--accent-light); }
  </style>
</head>
<body>
  <main>
    <img src="/app/mark.png" alt="Lost Pines Creative logo" width="72" height="72">
    <h1>You're all set</h1>
    <p>Close this page to go back to the Lost Pines app. Changes to your card or invoices show up there right away.</p>
    <p style="margin-top:10px">Questions about a bill? <a href="mailto:ddesmit@lostpinescreative.com">ddesmit@lostpinescreative.com</a></p>
  </main>
</body>
</html>
